<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aarohan CropSage · స్మార్ట్ క్రాప్ సూచన | Premium Form + Benefits</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts: Outfit + Telugu -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', 'Noto Sans Telugu', sans-serif;
            background: linear-gradient(145deg, #0c0f1e 0%, #1a1f30 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
            color: #eef2ff;
        }

        /* animated orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            animation: float 20s infinite alternate;
        }

        .orb1 {
            width: 500px;
            height: 500px;
            background: #3945b0;
            top: -200px;
            left: -100px;
            opacity: 0.25;
        }

        .orb2 {
            width: 600px;
            height: 600px;
            background: #b03a6b;
            bottom: -250px;
            right: -150px;
            opacity: 0.2;
            animation-duration: 28s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(100px, -80px) scale(1.3);
            }
        }

        /* main container — glassmorphism */
        .main {
            max-width: 1300px;
            width: 100%;
            background: rgba(20, 25, 40, 0.4);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 70px;
            box-shadow: 0 50px 90px -20px #02021a, 0 0 0 1px #a29eff40 inset;
            padding: 3rem 3rem;
            position: relative;
            z-index: 30;
            border: 1px solid rgba(170, 150, 255, 0.25);
        }

        /* header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .title h1 {
            font-size: 3.2rem;
            font-weight: 700;
            background: linear-gradient(145deg, #ffdbb5, #c3b0ff, #a6dcff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .title h1 i {
            color: #ffb56b;
            margin-right: 15px;
        }

        .title .telugu {
            font-size: 1.5rem;
            color: #bcc6ff;
            margin-top: 0.2rem;
        }

        .chip {
            background: #2d3150;
            border-radius: 70px;
            padding: 0.8rem 2.2rem;
            border: 2px solid #8f7ed6;
            color: #eae3ff;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* ===== FORM SECTION — clean centered ===== */
        .form-container {
            background: rgba(12, 15, 30, 0.7);
            backdrop-filter: blur(16px);
            border-radius: 60px;
            padding: 2.8rem 3rem;
            border: 2px solid #6f5fb0;
            box-shadow: 0 30px 50px -18px #040212;
            margin: 2rem 0 3rem;
        }

        .form-title {
            font-size: 2rem;
            color: #ded5ff;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 6px solid #ffaa70;
            padding-left: 1.5rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }

        .input-group {
            background: rgba(30, 35, 58, 0.6);
            border-radius: 40px;
            padding: 1.4rem 1.8rem;
            border: 2px solid #5d5296;
            transition: 0.2s;
        }

        .input-group:hover {
            border-color: #a28eff;
            background: #252d4a;
        }

        .input-group label {
            font-size: 1.2rem;
            font-weight: 600;
            color: #d0c7ff;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 0.8rem;
        }

        .input-group select,
        .input-group .slider-container {
            width: 100%;
        }

        .input-group select {
            width: 100%;
            padding: 0.8rem 1rem;
            background: #1b1f38;
            border: 2px solid #7b6ab3;
            border-radius: 50px;
            color: #f0ecff;
            font-size: 1.2rem;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='%23b09eff'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 1.2rem center;
            cursor: pointer;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .slider-container input {
            flex: 1;
            height: 10px;
            border-radius: 20px;
            background: #2c3152;
            -webkit-appearance: none;
        }

        .slider-container input::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 26px;
            height: 26px;
            background: linear-gradient(145deg, #f0ba6b, #c47aff);
            border-radius: 50%;
            border: 3px solid #ffeaa0;
            cursor: pointer;
        }

        #waterValue {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffcf8a;
            min-width: 45px;
        }

        .suggest-btn {
            background: linear-gradient(145deg, #6d4faa, #4f3c88);
            border: none;
            color: white;
            font-size: 2rem;
            font-weight: 700;
            padding: 1.4rem 3rem;
            border-radius: 70px;
            box-shadow: 0 25px 40px -10px #2f2666, 0 0 0 3px #e9c6ff inset;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            margin: 2.5rem 0 1rem;
        }

        .suggest-btn:hover {
            background: #816ad2;
            transform: translateY(-4px);
            gap: 30px;
        }

        /* ===== RESULTS SECTION ===== */
        .results-section {
            margin-top: 3rem;
            display: none;
        }

        .results-section.show {
            display: block;
            animation: fadeUp 0.5s;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .results-header {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            margin-bottom: 2.5rem;
        }

        .results-header i {
            font-size: 3rem;
            color: #fec285;
            background: #2d3150;
            padding: 1rem;
            border-radius: 50%;
        }

        .results-header h2 {
            font-size: 2.4rem;
            color: #f0e6ff;
        }

        .crop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }

        .crop-card {
            background: rgba(28, 30, 50, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            padding: 2.2rem 2rem;
            border: 2px solid #8e7ad6;
            transition: 0.25s;
            box-shadow: 0 30px 35px -15px #030210;
        }

        .crop-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: #ffbe6e;
            background: #2c2f52;
        }

        .crop-icon {
            font-size: 3.5rem;
            background: #3a3670;
            width: 80px;
            height: 80px;
            border-radius: 30% 70% 30% 70%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.2rem;
            color: #ffe28a;
        }

        .crop-name {
            font-size: 2rem;
            font-weight: 700;
            color: #fff3d6;
        }

        .crop-name span {
            font-size: 1.2rem;
            color: #bfb0ff;
            margin-left: 10px;
        }

        .match-bar {
            background: #262b48;
            height: 12px;
            border-radius: 30px;
            margin: 1.2rem 0 1.5rem;
            overflow: hidden;
        }

        .match-fill {
            height: 100%;
            background: linear-gradient(90deg, #c38eff, #ffac6b);
            width: 0%;
            border-radius: 30px;
        }

        .benefits-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.8rem;
            margin: 1.5rem 0 0.8rem;
        }

        .benefit-item {
            background: #252b4a;
            border-radius: 30px;
            padding: 0.6rem 0.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: #c9d2ff;
            border: 1px solid #5f5590;
        }

        .benefit-item i {
            display: block;
            font-size: 1.2rem;
            color: #fec285;
            margin-bottom: 0.2rem;
        }

        .tag {
            background: #383d68;
            border-radius: 40px;
            padding: 0.3rem 1.2rem;
            font-size: 0.9rem;
            display: inline-block;
            margin-right: 0.5rem;
            margin-top: 0.8rem;
            color: #d4dcff;
        }

        @media (max-width: 900px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <div class="main">
        <div class="header">
            <div class="title">
                <h1><i class="fas fa-seedling"></i> Aarohan CropSage</h1>
                <div class="telugu">నేల · వాతావరణం · నీరు → పంట సూచన</div>
            </div>
            <div class="chip"><i class="fas fa-chart-simple"></i> ప్రీమియమ్ సూచన</div>
        </div>

        <!-- ===== CLEAN FORM ===== -->
        <div class="form-container">
            <div class="form-title">
                <i class="fas fa-clipboard-list"></i> మీ పొలం వివరాలు నమోదు చేయండి
            </div>
            <div class="form-grid">
                <!-- soil -->
                <div class="input-group">
                    <label><i class="fas fa-mountain"></i> నేల రకం</label>
                    <select id="soilType">
                        <option value="clay">బంకమట్టి (Clay)</option>
                        <option value="sandy">ఇసుక (Sandy)</option>
                        <option value="loamy">లోమీ (Loamy)</option>
                        <option value="black">నల్లరేగడి (Black)</option>
                        <option value="red">ఎర్ర నేల (Red)</option>
                    </select>
                </div>
                <!-- weather -->
                <div class="input-group">
                    <label><i class="fas fa-cloud-sun"></i> వాతావరణం</label>
                    <select id="weather">
                        <option value="hot">వేడి (Hot)</option>
                        <option value="moderate">మితమైన (Moderate)</option>
                        <option value="cool">చల్లని (Cool)</option>
                        <option value="humid">తేమగా (Humid)</option>
                        <option value="rainy">వర్షపు (Rainy)</option>
                    </select>
                </div>
                <!-- water slider -->
                <div class="input-group">
                    <label><i class="fas fa-water"></i> నీటి లభ్యత (1-10)</label>
                    <div class="slider-container">
                        <input type="range" id="waterSlider" min="1" max="10" value="6">
                        <span id="waterValue">6</span>
                    </div>
                </div>
            </div>
            <button class="suggest-btn" id="suggestBtn"><i class="fas fa-magic"></i> పంటలను సూచించండి <i
                    class="fas fa-arrow-right"></i></button>
        </div>

        <!-- ===== RESULTS (benefits shown inside cards) ===== -->
        <div class="results-section" id="resultsSection">
            <div class="results-header">
                <i class="fas fa-star"></i>
                <h2>మీకు అనువైన పంటలు · ప్రయోజనాలతో</h2>
            </div>
            <div class="crop-grid" id="cropList">
                <!-- injected via js -->
            </div>
        </div>
    </div>

    <script>
        (function () {
            const soilSelect = document.getElementById('soilType');
            const weatherSelect = document.getElementById('weather');
            const waterSlider = document.getElementById('waterSlider');
            const waterSpan = document.getElementById('waterValue');
            const suggestBtn = document.getElementById('suggestBtn');
            const resultsSection = document.getElementById('resultsSection');
            const cropListDiv = document.getElementById('cropList');

            waterSlider.addEventListener('input', () => {
                waterSpan.innerText = waterSlider.value;
            });

            // Crop database with benefits (market, pest, resource)
            const crops = [
                { name: 'వరి', en: 'Paddy', soil: ['clay', 'loamy'], weather: ['humid', 'rainy'], waterMin: 6, market: 'అధిక డిమాండ్', pest: 'మధ్యస్థ నిరోధకత', resource: 'ఎక్కువ నీరు/ఎరువులు', icon: '🌾', color: '#f0d9a0' },
                { name: 'చెరకు', en: 'Sugarcane', soil: ['clay', 'loamy', 'black'], weather: ['hot', 'humid'], waterMin: 7, market: 'అధిక డిమాండ్', pest: 'మధ్యస్థం', resource: 'అధిక వనరులు', icon: '🎋', color: '#b3d9a0' },
                { name: 'పత్తి', en: 'Cotton', soil: ['black', 'red', 'loamy'], weather: ['hot', 'moderate'], waterMin: 4, market: 'అధిక డిమాండ్', pest: 'తక్కువ నిరోధకత (జాగ్రత్త)', resource: 'మధ్యస్థ వనరులు', icon: '🌿', color: '#f0b5b5' },
                { name: 'మొక్కజొన్న', en: 'Maize', soil: ['loamy', 'sandy'], weather: ['moderate', 'hot'], waterMin: 4, market: 'మధ్యస్థ డిమాండ్', pest: 'మధ్యస్థ నిరోధకత', resource: 'మధ్యస్థం', icon: '🌽', color: '#f5d0a9' },
                { name: 'కందులు', en: 'Pigeonpea', soil: ['red', 'loamy'], weather: ['moderate', 'hot'], waterMin: 3, market: 'మంచి డిమాండ్', pest: 'అధిక నిరోధకత', resource: 'తక్కువ వనరులు', icon: '🫘', color: '#c4e0a0' },
                { name: 'వేరుశనగ', en: 'Groundnut', soil: ['sandy', 'loamy'], weather: ['moderate', 'hot'], waterMin: 3, market: 'మంచి డిమాండ్', pest: 'మధ్యస్థ నిరోధకత', resource: 'తక్కువ వనరులు', icon: '🥜', color: '#e3c794' },
                { name: 'కాఫీ', en: 'Coffee', soil: ['loamy', 'red'], weather: ['cool', 'humid'], waterMin: 5, market: 'అధిక డిమాండ్', pest: 'మధ్యస్థ నిరోధకత', resource: 'మధ్యస్థ వనరులు', icon: '☕', color: '#c7a17b' },
                { name: 'డ్రాగన్ ఫ్రూట్', en: 'Dragon Fruit', soil: ['sandy', 'loamy'], weather: ['hot', 'moderate'], waterMin: 3, market: 'అధిక డిమాండ్ (నగరాలు)', pest: 'అధిక నిరోధకత', resource: 'తక్కువ వనరులు', icon: '🐉', color: '#f4a2a2' },
                { name: 'స్టెవియా', en: 'Stevia', soil: ['loamy', 'sandy'], weather: ['moderate', 'hot'], waterMin: 4, market: 'పెరుగుతున్న డిమాండ్', pest: 'అధిక నిరోధకత', resource: 'తక్కువ వనరులు', icon: '🌿', color: '#a6d9a6' },
                { name: 'పసుపు', en: 'Turmeric', soil: ['loamy', 'clay'], weather: ['humid', 'rainy'], waterMin: 5, market: 'స్థిరమైన డిమాండ్', pest: 'మధ్యస్థ నిరోధకత', resource: 'మధ్యస్థ వనరులు', icon: '🟡', color: '#f5d76e' }
            ];

            function calculateMatches() {
                const soil = soilSelect.value;
                const weather = weatherSelect.value;
                const water = parseInt(waterSlider.value);

                const scored = crops.map(c => {
                    let score = 0;
                    if (c.soil.includes(soil)) score += 35;
                    if (c.weather.includes(weather)) score += 30;
                    if (water >= c.waterMin) score += 25;
                    else if (water >= c.waterMin - 2) score += 10;
                    return { ...c, match: Math.min(99, score) };
                }).sort((a, b) => b.match - a.match).slice(0, 6);

                return scored;
            }

            suggestBtn.addEventListener('click', async () => {
                const soil = soilSelect.value;
                const weather = weatherSelect.value;
                const water = waterSlider.value;

                suggestBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> సూచనలు పొందుతున్నాము...';
                suggestBtn.disabled = true;

                try {
                    const response = await fetch('/api/crop-suggest', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ soil, weather, water })
                    });

                    const data = await response.json();

                    if (data.success && data.crops) {
                        cropListDiv.innerHTML = '';
                        data.crops.forEach(c => {
                            const card = document.createElement('div');
                            card.className = 'crop-card';
                            card.innerHTML = `
                                <div class="crop-icon" style="background:${c.color || '#f0d9a0'}30; color:${c.color || '#f0d9a0'};">${c.icon || '🌾'}</div>
                                <div class="crop-name">${c.name} <span>${c.en || ''}</span></div>
                                <div class="match-bar"><div class="match-fill" style="width:${c.match || 95}%"></div></div>
                                <div style="font-size:1.2rem; margin:0.2rem 0 1rem;">${c.match || 95}% అనుకూలత</div>
                                <!-- BENEFITS SECTION (market, pest, resource) -->
                                <div class="benefits-grid">
                                    <div class="benefit-item"><i class="fas fa-chart-line"></i> ${c.market || 'Unknown'}</div>
                                    <div class="benefit-item"><i class="fas fa-bug"></i> ${c.pest || 'Unknown'}</div>
                                    <div class="benefit-item"><i class="fas fa-tractor"></i> ${c.resource || 'Unknown'}</div>
                                </div>
                                <div style="margin-top:1rem;">
                                    <span class="tag"><i class="fas fa-droplet"></i> నీరు ${c.waterMin || 5}+</span>
                                    <span class="tag"><i class="fas fa-temperature-high"></i> ${(c.weather || []).join('/') || weather}</span>
                                </div>
                            `;
                            cropListDiv.appendChild(card);
                        });
                        resultsSection.classList.add('show');
                    } else {
                        alert("API Error: " + data.error);
                    }
                } catch (error) {
                    console.error("Fetch Error:", error);
                    alert("సర్వర్ కి కనెక్ట్ కావడంలో విఫలమైంది / Failed to connect to server");
                }

                suggestBtn.innerHTML = '<i class="fas fa-magic"></i> పంటలను సూచించండి <i class="fas fa-arrow-right"></i>';
                suggestBtn.disabled = false;
            });
        })();
    </script>
    <script src="../auth.js"></script>
</body>

</html>
