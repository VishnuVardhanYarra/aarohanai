<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aarohan-AI Home Page</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Ionicons for Icons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>

<body>

    <!-- Animated Background Video (Fallback to gradient if video fails) -->
    <div class="video-container">
        <video id="bg-video" autoplay loop muted playsinline>
            <!-- Replace this src with your actual video link if you have one -->
            <source
                src="https://assets.mixkit.co/videos/preview/mixkit-globe-with-a-network-of-connections-31238-large.mp4"
                type="video/mp4">
        </video>
        <div class="video-overlay"></div>
    </div>

    <!-- Top Left Sidebar Toggle & Hidden Sidebar -->
    <button id="sidebar-toggle" class="glass-btn sidebar-btn">
        <ion-icon name="menu-outline"></ion-icon>
    </button>

    <div id="ai-sidebar" class="sidebar hidden">
        <div class="sidebar-header">
            <h3>Agentic-AI Kittu</h3>
            <button id="close-sidebar"><ion-icon name="close-outline"></ion-icon></button>
        </div>
        <div class="sidebar-content">
            <div class="chat-message bot">
                <p>Hello! I am <strong>Agentic-AI Kittu</strong>, your smart voice assistant for Aarohan. I can listen,
                    respond, and automate tasks in our application. How can I speed up your work today?</p>
            </div>
            <!-- More messages will appear here -->
        </div>
        <div class="sidebar-input">
            <button id="mic-btn"
                style="background: transparent; border: none; color: white; cursor: pointer; padding: 0 5px;"
                title="Hold to Speak">
                <ion-icon name="mic-outline" style="font-size: 1.5rem;"></ion-icon>
            </button>
            <input type="text" placeholder="Type a command...">
            <button id="send-btn"><ion-icon name="send"></ion-icon></button>
        </div>
    </div>

    <!-- Top Right Nav: Updates, Features, Profile -->
    <nav class="top-right-nav glass-panel">
        <a href="#" class="nav-link">Updates</a>
        <a href="#" class="nav-link">Features</a>
        <div
            style="display: flex; align-items: center; gap: 10px; padding-left: 10px; border-left: 1px solid rgba(255, 255, 255, 0.2);">
            <div class="native-profile-avatar"
                style="width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.1)); border: 1px solid rgba(255,255,255,0.4); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-family: 'Outfit', sans-serif; font-size: 1.1rem; box-shadow: 0 0 10px rgba(255,255,255,0.2);">
                <ion-icon name="person"></ion-icon>
            </div>
            <div style="display: flex; flex-direction: column; line-height: 1.1;">
                <span class="native-profile-name"
                    style="color: white; font-weight: 700; font-family: 'Outfit', sans-serif; font-size: 0.95rem; letter-spacing: 0.5px;">Guest</span>
                <span class="native-profile-occ"
                    style="color: rgba(255, 255, 255, 0.7); font-size: 0.75rem; font-weight: 400; font-family: 'Outfit', sans-serif;">User</span>
            </div>
            <button onclick="window.handleNativeLogout()" title="Logout"
                style="background: rgba(255, 71, 87, 0.2); border: 1px solid rgba(255, 71, 87, 0.4); border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: #ff6b81; cursor: pointer; transition: all 0.3s; margin-left: 5px;">
                <ion-icon name="log-out-outline" style="font-size: 1.2rem;"></ion-icon>
            </button>
        </div>
    </nav>

    <!-- Main 3D Circular Carousel -->
    <main class="carousel-container">
        <div class="carousel" id="carousel">
            <!-- Module Cards generated by JavaScript -->
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="prev-btn" class="glass-btn"><ion-icon name="chevron-back-outline"></ion-icon></button>
            <button id="next-btn" class="glass-btn"><ion-icon name="chevron-forward-outline"></ion-icon></button>
        </div>
    </main>

    <!-- Bottom Center AI Agent Logo -->
    <div class="bottom-ai-container">
        <div class="ai-glow-ring"></div>
        <div class="ai-logo" id="ai-logo" title="Click to activate AI">
            <img src="assets/agent_logo.jpg" alt="Agentic-AI Kittu" id="ai-agent-img">
            <div class="ring ring1"></div>
            <div class="ring ring2"></div>
        </div>
        <span class="ai-status">Listening...</span>
    </div>

    <script src="script.js"></script>
    <script src="../auth.js"></script>
</body>

</html>
