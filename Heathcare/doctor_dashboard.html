<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard | Aarohan Health</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4ecdc4;
            --secondary: #1a4b5e;
            --dark: #0d2b3e;
            --light: #f4f7f6;
            --white: #ffffff;
            --success: #2ecc71;
            --warning: #f1c40f;
            --danger: #e74c3c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--dark);
            color: var(--white);
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar */
        aside {
            width: 280px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        nav {
            flex: 1;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s;
            margin-bottom: 0.5rem;
        }

        .nav-link:hover,
        .nav-link.active {
            background: rgba(78, 205, 196, 0.1);
            color: var(--primary);
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 16px;
            margin-top: auto;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .profile-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--dark);
        }

        /* Main Content */
        main {
            margin-left: 280px;
            flex: 1;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-card h3 {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 0.5rem;
        }

        .stat-card .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
        }

        /* Appointments Table */
        .section-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            backdrop-filter: blur(5px);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 1rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        td {
            padding: 1.2rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .badge {
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-pending {
            background: rgba(241, 196, 15, 0.1);
            color: var(--warning);
        }

        .badge-completed {
            background: rgba(46, 204, 113, 0.1);
            color: var(--success);
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 1rem;
            padding: 0.5rem;
            transition: 0.3s;
        }

        .action-btn:hover {
            transform: scale(1.2);
        }

        .loader {
            display: flex;
            justify-content: center;
            padding: 3rem;
        }

        .hidden {
            display: none;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            aside {
                width: 80px;
                padding: 1rem;
            }

            .logo span,
            .nav-link span,
            .profile-card div {
                display: none;
            }

            main {
                margin-left: 80px;
            }
        }
    </style>
</head>

<body>
    <aside>
        <div class="logo">
            <i class="fas fa-hand-holding-medical"></i>
            <span>Aarohan Health</span>
        </div>
        <nav>
            <a href="#" class="nav-link active">
                <i class="fas fa-calendar-check"></i>
                <span>Appointments</span>
            </a>
            <a href="#" class="nav-link">
                <i class="fas fa-user-injured"></i>
                <span>Patients</span>
            </a>
            <a href="#" class="nav-link">
                <i class="fas fa-file-medical"></i>
                <span>Records</span>
            </a>
            <a href="#" class="nav-link">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </nav>
        <div class="profile-card" id="doctorProfile">
            <div class="profile-img" id="docInitial">D</div>
            <div>
                <p class="font-bold text-sm" id="docName">Dr. Loading...</p>
                <p class="text-xs opacity-50" id="docSpec">Spec</p>
            </div>
        </div>
    </aside>

    <main>
        <header>
            <div>
                <h1 id="welcomeMsg">Welcome, Doctor</h1>
                <p class="opacity-50">Here's your schedule for today.</p>
            </div>
            <button class="action-btn" onclick="fetchAppointments()">
                <i class="fas fa-sync-alt"></i>
            </button>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Appointments</h3>
                <div class="value" id="totalAppts">0</div>
            </div>
            <div class="stat-card">
                <h3>Pending</h3>
                <div class="value" id="pendingAppts">0</div>
            </div>
            <div class="stat-card">
                <h3>Completed</h3>
                <div class="value" id="completedAppts">0</div>
            </div>
        </div>

        <div class="section-box">
            <div class="section-header">
                <h2>Appointment Requests</h2>
                <div class="search" style="position: relative;">
                    <i class="fas fa-search"
                        style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.3)"></i>
                    <input type="text" placeholder="Search patients..."
                        style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 0.6rem 1rem 0.6rem 2.8rem; color: white; outline: none;">
                </div>
            </div>

            <div id="loader" class="loader">
                <i class="fas fa-spinner fa-spin fa-2x" style="color: var(--primary)"></i>
            </div>

            <div id="tableContainer" class="hidden">
                <table>
                    <thead>
                        <tr>
                            <th>Patient Name</th>
                            <th>Disease / Records</th>
                            <th>Location</th>
                            <th>Request Date</th>
                            <th>Preferred Slot</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentTableBody">
                        <!-- Filled by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const docDetails = JSON.parse(localStorage.getItem('doctorDetails'));

        if (!docDetails) {
            window.location.href = 'doctor.html';
        }

        document.getElementById('docName').innerText = docDetails.fullName;
        document.getElementById('docSpec').innerText = docDetails.specialization;
        document.getElementById('docInitial').innerText = docDetails.fullName.charAt(0).toUpperCase();
        document.getElementById('welcomeMsg').innerText = `Welcome, Dr. ${docDetails.fullName.split(' ')[0]}`;

        async function fetchAppointments() {
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('tableContainer').classList.add('hidden');

            try {
                const response = await fetch(`/api/doctor_appointments?doctor_email=${docDetails.email}`);
                const data = await response.json();

                if (data.success) {
                    const tableBody = document.getElementById('appointmentTableBody');
                    tableBody.innerHTML = '';

                    data.appointments.forEach(appt => {
                        const row = `
                            <tr>
                                <td><strong>${appt.patientName}</strong></td>
                                <td style="max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${appt.disease}</td>
                                <td>${appt.location}</td>
                                <td>${new Date(appt.created_at).toLocaleDateString()}</td>
                                <td>${appt.prefDate || 'ASAP'}</td>
                                <td><span class="badge badge-${appt.status.toLowerCase()}">${appt.status}</span></td>
                                <td>
                                    <button class="action-btn" title="View Records"><i class="fas fa-eye"></i></button>
                                    <button class="action-btn" title="Complete Appointment"><i class="fas fa-check-circle"></i></button>
                                </td>
                            </tr>
                        `;
                        tableBody.insertAdjacentHTML('beforeend', row);
                    });

                    document.getElementById('totalAppts').innerText = data.appointments.length;
                    document.getElementById('pendingAppts').innerText = data.appointments.filter(a => a.status === 'Pending').length;
                    document.getElementById('completedAppts').innerText = data.appointments.filter(a => a.status === 'Completed').length;

                } else {
                    alert('Error fetching appointments: ' + data.error);
                }
            } catch (err) {
                console.error(err);
            } finally {
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('tableContainer').classList.remove('hidden');
            }
        window.onload = fetchAppointments;
    </script>
</body>

</html>
