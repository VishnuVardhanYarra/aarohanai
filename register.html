<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>గ్రామ స్మార్ట్ నమోదు · Aarohan-AI Register</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', 'Noto Sans Telugu', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== BACKGROUND IMAGE ===== */
        .village-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-image: url('https://i.pinimg.com/736x/21/1d/d1/211dd12a34534cb137d52f1df98817e9.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(20, 30, 10, 0.15) 0%, rgba(0, 0, 0, 0.3) 100%);
            z-index: 1;
        }

        .login-universe {
            position: relative;
            z-index: 50;
            width: 100%;
            max-width: 520px;
            margin: 2rem;
        }

        .village-card {
            background: rgba(15, 30, 15, 0.85); /* Deep dark forest green for high contrast */
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            border: 1.5px solid rgba(255, 215, 120, 0.45); /* Brighter gold border */
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s;
        }

        .village-card:hover {
            transform: translateY(-3px);
        }

        .village-header {
            text-align: center;
            margin-bottom: 2.2rem;
        }

        .village-header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            color: #fff9e6;
            text-shadow: 3px 3px 0 #2d5a2d, 0 0 20px rgba(255, 215, 0, 0.3);
            line-height: 1.2;
        }

        .telugu-title {
            font-size: 2.2rem;
            display: block;
            margin-bottom: 0.3rem;
        }

        .english-title {
            font-size: 1.5rem;
            display: block;
            color: #fff3d6;
        }

        .subhead {
            font-size: 1rem;
            color: #f0e6cc;
            background: rgba(255, 215, 0, 0.15);
            padding: 0.5rem;
            border-radius: 30px;
            margin-top: 0.5rem;
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input,
        .input-wrapper select {
            width: 100%;
            padding: 1.4rem 1.5rem 0.8rem 1.5rem;
            font-size: 1.2rem;
            background: rgba(0, 0, 0, 0.55); /* High-contrast dark background */
            border: 2px solid rgba(255, 215, 140, 0.65); /* Well-defined gold border */
            border-radius: 16px;
            outline: none;
            color: #ffffff; /* Pure white text for clarity */
            font-weight: 500;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .input-wrapper select {
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%23ffd966" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>');
            background-repeat: no-repeat;
            background-position: right 1.2rem center;
        }

        /* Styling dropdown option elements for readability */
        select option {
            background: #142814 !important;
            color: #ffffff !important;
            padding: 0.8rem;
        }

        .input-wrapper label {
            position: absolute;
            left: 1.5rem;
            top: 1.1rem;
            font-size: 1.1rem;
            color: #ffd9a3; /* Soft cream/gold color */
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            transition: 0.2s ease;
            padding: 0 0.5rem;
            background: transparent;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-wrapper label span {
            font-size: 0.9rem;
            opacity: 0.95;
        }

        .input-wrapper input:focus~label,
        .input-wrapper input:not(:placeholder-shown)~label,
        .input-wrapper select:focus~label,
        .input-wrapper select:not([value=""]):valid~label {
            top: -10px;
            left: 1.2rem;
            font-size: 0.85rem;
            background: rgba(255, 215, 120, 1); /* Solid bright gold label container */
            color: #0d250d; /* Dark green text */
            padding: 0.2rem 1rem;
            border-radius: 20px;
            font-weight: 700;
            border: 1px solid #ffffff;
            backdrop-filter: blur(4px);
        }

        .input-wrapper input:focus,
        .input-wrapper select:focus {
            border-color: #ffffff; /* Bright white border on focus */
            background: rgba(0, 0, 0, 0.7);
            box-shadow: 0 0 25px rgba(255, 215, 120, 0.4);
        }

        .input-wrapper input::placeholder {
            color: transparent;
        }

        .email-field {
            border-style: dashed;
            border-color: rgba(255, 215, 140, 0.75);
        }

        .age-selector {
            width: 100%;
            padding: 1.4rem 1.5rem;
            font-size: 1.2rem;
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid rgba(255, 215, 140, 0.65);
            border-radius: 16px;
            color: #ffffff;
            outline: none;
            backdrop-filter: blur(5px);
            cursor: pointer;
        }

        .age-selector option {
            background: #142814;
            color: #ffffff;
            padding: 0.5rem;
        }

        /* ===== BUTTON ROW - perfect alignment ===== */
        .role-button-row {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        /* ===== SHARED BUTTON STYLES - NO SYMBOLS, SMALLER TEXT ===== */
        .admin-button,
        .doctor-button {
            flex: 1 1 0;
            /* equal width */
            min-width: 0;
            padding: 0.8rem 0.3rem;
            /* slightly reduced vertical padding */
            font-size: 1rem;
            /* REDUCED text size */
            font-weight: 600;
            border-radius: 40px;
            color: #fff9e6;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.2rem;
            white-space: nowrap;
            border: 2px solid;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 0 rgba(20, 40, 70, 0.4), 0 8px 25px rgba(0, 0, 0, 0.3);
            line-height: 1.2;
        }

        /* Admin specific - no symbols */
        .admin-button {
            background: rgba(50, 80, 130, 0.25);
            border-color: rgba(255, 215, 140, 0.4);
        }

        .admin-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 11px 0 rgba(20, 40, 70, 0.4), 0 12px 30px rgba(0, 0, 0, 0.3);
            background: rgba(60, 100, 160, 0.35);
            border-color: rgba(255, 235, 170, 0.7);
        }

        .admin-button:active {
            transform: translateY(5px);
            box-shadow: 0 4px 0 rgba(20, 40, 70, 0.4), 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        /* Doctor specific - no symbols, distinct color */
        .doctor-button {
            background: rgba(20, 90, 70, 0.3);
            border-color: rgba(150, 220, 180, 0.5);
            box-shadow: 0 8px 0 rgba(10, 50, 40, 0.5), 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .doctor-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 11px 0 rgba(10, 50, 40, 0.5), 0 12px 30px rgba(0, 0, 0, 0.3);
            background: rgba(30, 120, 90, 0.4);
            border-color: rgba(200, 255, 200, 0.7);
        }

        .doctor-button:active {
            transform: translateY(5px);
            box-shadow: 0 4px 0 rgba(10, 50, 40, 0.5), 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        /* ===== LET'S START BUTTON ===== */
        .start-button {
            width: 100%;
            padding: 1.2rem;
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(145deg, rgba(255, 200, 100, 0.7), rgba(180, 120, 50, 0.7));
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 235, 170, 0.6);
            border-radius: 40px;
            color: #fff9e6;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 12px 0 rgba(80, 45, 10, 0.5), 0 10px 30px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.1s;
            margin: 1rem 0 0.8rem;
        }

        .start-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 0 rgba(80, 45, 10, 0.5), 0 15px 35px rgba(0, 0, 0, 0.3);
            background: linear-gradient(145deg, rgba(255, 210, 120, 0.8), rgba(190, 130, 60, 0.8));
        }

        .start-button:active {
            transform: translateY(6px);
            box-shadow: 0 6px 0 rgba(60, 35, 5, 0.5), 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .village-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            color: #f8eac0;
            font-size: 1rem;
        }

        .footer-icons {
            display: flex;
            gap: 1rem;
            font-size: 1.5rem;
            opacity: 0.8;
        }

        /* ===== RESPONSIVE FIXES ===== */
        @media (max-width: 500px) {
            .village-card {
                padding: 1.8rem 1.2rem;
            }

            .telugu-title {
                font-size: 1.9rem;
            }

            .english-title {
                font-size: 1.3rem;
            }

            .start-button {
                font-size: 1.5rem;
            }

            .role-button-row {
                gap: 0.5rem;
            }

            .admin-button,
            .doctor-button {
                font-size: 0.85rem;
                /* even smaller on mobile */
                padding: 0.6rem 0.2rem;
                letter-spacing: 0.5px;
                white-space: normal;
                word-break: break-word;
            }
        }

        @media (max-width: 380px) {

            .admin-button,
            .doctor-button {
                font-size: 0.75rem;
            }
        }
    </style>
</head>

<body>
    <div class="village-bg"></div>
    <div class="overlay"></div>

    <div class="login-universe">
        <div class="village-card">
            <div class="village-header">
                <h1>
                    <span class="telugu-title">గ్రామ స్మార్ట్</span>
                    <span class="english-title">Aarohan-AI</span>
                </h1>
                <div class="subhead">కనెక్ట్ అవ్వండి · connect with us</div>
            </div>

            <form id="villageForm" onsubmit="event.preventDefault();">
                <div class="form-grid">
                    <div class="input-wrapper">
                        <input type="text" id="fullName" placeholder=" " autocomplete="off">
                        <label for="fullName">👨‍🌾 <span>పూర్తి పేరు · full name</span></label>
                    </div>

                    <div class="input-wrapper">
                        <input type="tel" id="mobile" placeholder=" " inputmode="numeric">
                        <label for="mobile">📱 <span>మొబైల్ నంబర్ · mobile</span></label>
                    </div>

                    <div class="input-wrapper">
                        <input type="email" id="email" placeholder=" " autocomplete="off" class="email-field">
                        <label for="email">✉️ <span>ఇమెయిల్ (ఐచ్ఛికం) · email (optional)</span></label>
                    </div>

                    <div class="input-wrapper">
                        <select id="occupation">
                            <option value="" disabled selected></option>
                            <option value="farmer">🌾 రైతు · farmer</option>
                            <option value="driver">🚜 డ్రైవర్ · driver</option>
                            <option value="student">📘 విద్యార్థి · student</option>
                            <option value="vendor">🏪 వ్యాపారి · vendor</option>
                        </select>
                        <label for="occupation">🧑‍🌾 <span>వృత్తి · occupation</span></label>
                    </div>

                    <div class="input-wrapper">
                        <select id="ageSelect" class="age-selector">
                            <option value="" disabled selected></option>
                            <option value="1-10">1-10 సంవత్సరాలు · 1-10 years</option>
                            <option value="11-20">11-20 సంవత్సరాలు · 11-20 years</option>
                            <option value="21-30">21-30 సంవత్సరాలు · 21-30 years</option>
                            <option value="31-40">31-40 సంవత్సరాలు · 31-40 years</option>
                            <option value="41-50">41-50 సంవత్సరాలు · 41-50 years</option>
                            <option value="51-60">51-60 సంవత్సరాలు · 51-60 years</option>
                            <option value="61-70">61-70 సంవత్సరాలు · 61-70 years</option>
                            <option value="71-80">71-80 సంవత్సరాలు · 71-80 years</option>
                            <option value="81-90">81-90 సంవత్సరాలు · 81-90 years</option>
                            <option value="91-100">91-100 సంవత్సరాలు · 91-100 years</option>
                        </select>
                        <label for="ageSelect">🎂 <span>వయస్సు · age range</span></label>
                    </div>

                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder=" ">
                        <label for="password">🔒 <span>పాస్‌వర్డ్ సృష్టించండి · create password</span></label>
                    </div>

                    <!-- BUTTON ROW: NO SYMBOLS, TEXT SIZE REDUCED -->
                    <div class="role-button-row" style="display: none;">
                        <button type="button" class="admin-button" id="adminBtn">
                            Panchayat · పంచాయతీ
                        </button>

                        <button type="button" class="doctor-button" id="doctorBtn">
                            Doctor · డాక్టర్
                        </button>
                    </div>

                    <button type="button" class="start-button" id="startBtn">Register · నమోదు చేయండి</button>
                    <div style="text-align: center; margin-top: 10px;">
                        <a href="login.html"
                            style="color: #ffd966; text-decoration: none; font-size: 1.1rem; text-shadow: 0 1px 3px rgba(0,0,0,0.5);">Already
                            have an account? Login Here</a>
                    </div>
                </div>
            </form>

            <div class="village-footer">
                <span>🌾 గ్రామ స్మార్ట్</span>
                <div class="footer-icons"></div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const btn = document.getElementById('startBtn');
            btn.addEventListener('click', async function () {
                const name = document.getElementById('fullName').value || 'అతిథి';
                const mobile = document.getElementById('mobile').value || '-';
                const email = document.getElementById('email').value || 'ఇవ్వలేదు';
                const occupation = document.getElementById('occupation').value || 'ఏదీ లేదు';
                const age = document.getElementById('ageSelect').value || 'పేర్కొనలేదు';

                const password = document.getElementById('password').value;

                if (!mobile || !password || !name) {
                    alert('దయచేసి పేరు, మొబైల్ నంబర్ మరియు పాస్‌వర్డ్‌ను పూరించండి.');
                    return;
                }

                let ageDisplay = age;
                const ageMap = {
                    '1-10': '1-10 years · 1-10 సంవత్సరాలు',
                    '11-20': '11-20 years · 11-20 సంవత్సరాలు',
                    '21-30': '21-30 years · 21-30 సంవత్సరాలు',
                    '31-40': '31-40 years · 31-40 సంవత్సరాలు',
                    '41-50': '41-50 years · 41-50 సంవత్సరాలు',
                    '51-60': '51-60 years · 51-60 సంవత్సరాలు',
                    '61-70': '61-70 years · 61-70 సంవత్సరాలు',
                    '71-80': '71-80 years · 71-80 సంవత్సరాలు',
                    '81-90': '81-90 years · 81-90 సంవత్సరాలు',
                    '91-100': '91-100 years · 91-100 సంవత్సరాలు'
                };
                if (ageMap[age]) ageDisplay = ageMap[age];

                const originalText = btn.innerHTML;
                btn.innerHTML = "Registering... <span style='font-size:0.5em;'>దయచేసి వేచి ఉండండి</span>";
                btn.disabled = true;

                document.querySelector('.village-card').style.boxShadow = '0 0 50px rgba(255, 200, 100, 0.5), 0 0 0 1px rgba(255, 215, 0, 0.3) inset';

                try {
                    const response = await fetch('/api/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, mobile, email, occupation, ageDisplay, password })
                    });

                    if (response.ok) {
                        localStorage.setItem('currentUser', JSON.stringify({
                            name: name,
                            mobile: mobile,
                            email: email,
                            occupation: occupation,
                            ageDisplay: ageDisplay
                        }));
                        const occLower = occupation ? occupation.toLowerCase() : '';
                        alert(`Registration successful! Welcome to Aarohan-AI, ${name}.`);
                        setTimeout(() => {
                            let redirectUrl = 'home_page/index.html?name=' + encodeURIComponent(name);
                            if (occLower === 'farmer' || occLower === 'రైతు') {
                                redirectUrl = 'farmer_support/village.html';
                            } else if (occLower === 'student' || occLower === 'విద్యార్థి') {
                                redirectUrl = 'Youth/seventh.html';
                            } else if (occLower === 'driver' || occLower === 'డ్రైవర్') {
                                redirectUrl = 'transport/fourth.html';
                            } else if (occLower === 'vendor' || occLower === 'వ్యాపారి' || occLower === 'render') {
                                redirectUrl = 'marketing/index.html';
                            }
                            window.location.href = redirectUrl;
                        }, 400);
                    } else {
                        const err = await response.json();
                        alert('Registration failed: ' + err.error);
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                    }
                } catch (e) {
                    console.error("Backend Error or Server offline:", e);
                    alert("Registration failed. Server is offline!");
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            });

            const adminBtn = document.getElementById('adminBtn');
            adminBtn.onclick = null; // Removing inline event
            adminBtn.addEventListener('click', function (e) {
                e.preventDefault();
                const pin = prompt("🔒 Enter Panchayat Admin PIN:");
                if (pin === "1234") {
                    localStorage.setItem('isAdmin', 'true');
                    window.location.href = 'government/panchayat_admin.html';
                } else if (pin !== null) {
                    alert("❌ Unauthorized access. Normal users will be redirected to the Aarohan-AI portal.");
                    window.location.href = 'government/smartvillage.html';
                }
            });

            const doctorBtn = document.getElementById('doctorBtn');
            doctorBtn.addEventListener('click', function (e) {
                e.preventDefault();
                window.location.href = 'Heathcare/doctor.html';
            });
        })();
    </script>
</body>

</html>
